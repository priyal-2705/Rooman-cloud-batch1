<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | ROOMAN CLOUD</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<header>

<nav class="navbar">

<div class="logo">

<i class="fa-solid fa-cloud"></i>

ROOMAN CLOUD

</div>

<ul class="nav-links">

<li><a href="index.html">Home</a></li>

<li><a href="about.html">About</a></li>

<li><a href="courses.html">Courses</a></li>

<li><a href="contact.html">Contact</a></li>

</ul>

<div class="buttons">

<a href="login.html" class="login">Login</a>

<a href="register.html" class="register active">Register</a>

</div>

</nav>

</header>

<section class="register-page">

<div class="register-card">

<div class="register-header">

<i class="fa-solid fa-user-plus"></i>

<h2>Create Account</h2>

<p>Join ROOMAN CLOUD and start your Cloud Journey.</p>

</div>

<form id="registerForm">

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
id="fullname"
placeholder="Full Name"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
id="email"
placeholder="Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-user-tag"></i>

<input
type="text"
id="username"
placeholder="Username"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-lock"></i>

<input
type="password"
id="password"
placeholder="Password"
required>

<i class="fa-solid fa-eye toggle-password"></i>

</div>

<div class="input-box">

    <i class="fa-solid fa-lock"></i>

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        required>

    <i class="fa-solid fa-eye toggle-password"></i>

</div>

<label class="terms">

<input type="checkbox" required>

I agree to the Terms & Conditions

</label>

<button type="submit">

Register

</button>

</form>

<div class="register-footer">

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

</div>

</section>

<footer class="footer">

<p>© 2026 ROOMAN CLOUD</p>

<p>CI/CD Pipeline using AWS • Docker • Jenkins</p>

</footer>

<script src="js/script.js"></script>

</body>

</html>
